name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: End to end and accessibility tests
        run: npm test
      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: site
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://thirumal-janakiraman.pages.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: pages deploy dist --project-name=thirumal-janakiraman --branch=main
